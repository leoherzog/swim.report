# .github/build/osmconf.ini - GDAL OSM driver configuration for the swim.report
# layer build (.github/workflows/build-layers.yml), passed via OSM_CONFIG_FILE.
#
# THERE IS DELIBERATELY NO [general] SECTION HEADER. The stock
# /usr/share/gdal/osmconf.ini carries one with the note "remove the below
# [general] line for GDAL < 3.10". Omitting it was verified to behave
# identically on GDAL 3.8.4 (the ubuntu-24.04 runner) and on 3.12.4, and it is
# the only variant that is warning-free on BOTH - so this file survives the
# eventual ubuntu-26.04 runner migration untouched. Do not "fix" it by adding
# the header back.
#
# WHY THIS FILE EXISTS AT ALL: the wikidata QID has to survive the trip from
# PBF to FlatGeobuf. The stock osmconf.ini promotes no wikidata attribute, so a
# QID lands inside the other_tags HSTORE blob instead of a real column - and
# src/waterClass.js matches Great Lakes shoreline by QID (GREAT_LAKE_QIDS).
# With the QID buried, that match collapses to zero SILENTLY, in the direction
# of mass-hiding every Great Lakes beach we serve. Promoting wikidata to a
# first-class String column in EVERY section below, combined with
# other_tags=no, is the fix. Verified end to end: osm_id 1205149 / name
# "Lake Michigan" / wikidata Q1169 survives PBF -> multipolygons -> FlatGeobuf
# -> Deno read.
#
# natural and type are promoted in every section for the same class of reason:
# the consumer branches on tags.natural === "water" and
# tags.natural === "coastline" (src/layerSignals.js), and on relation type in
# other_relations. An attribute that is not promoted here is not a column
# anywhere downstream, however the layer is later carved - no ogr2ogr
# invocation in this pipeline passes -select.
#
# attribute_name_laundering=no keeps key names verbatim (no ':' -> '_'
# rewriting), so the reader's field names match the OSM tag names exactly.
#
# other_tags=no in every section drops the HSTORE catch-all column entirely.
# It is dead weight on every published feature once the tags we branch on are
# promoted, and leaving it on invites a consumer to start reading tags out of
# it - which would silently depend on a blob whose contents no gate checks.
#
# A SECOND, NEARLY IDENTICAL COPY LIVES AT osmconf-lines.ini. The only
# difference is closed_ways_are_polygons (see the comment on that line below);
# diff the two files and nothing else should show up. Keep them in step.

# "natural" is in this list, which is exactly what routes CLOSED
# natural=coastline ways (islands) into the multipolygons layer while open ones
# go to lines. That is correct for every layer except coastline, which is why
# osmconf-lines.ini exists with a reduced list.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism
attribute_name_laundering=no

[points]
osm_id=yes
attributes=name,loc_name,natural,leisure,wikidata
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[lines]
osm_id=yes
attributes=name,loc_name,natural,leisure,boundary,water,wikidata
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name,type,natural,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multipolygons]
osm_id=yes
attributes=name,loc_name,type,natural,leisure,boundary,water,protect_class,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[other_relations]
osm_id=yes
attributes=name,type,natural,water,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no
