name: Water-body classification (retained, manual only)

# ============================================================================
# FOLLOW-UP — THIS FILE IS SCHEDULED FOR DELETION AND IS BLOCKED ON ONE
# MEASUREMENT. DO NOT DELETE IT UNTIL THAT MEASUREMENT EXISTS.
#
# The FGB layer migration folds water-body classification into discovery.yml:
# the classification pass is now a LOCAL spatial join over the prebuilt layer
# set, not hundreds of sequential Overpass probes, so the starvation risk that
# justified a separate workflow is gone and a beach is classified in the same
# run that discovers it (the FLAG_WORTHY_WATER_SQL fail-open window drops from
# hours to zero).
#
# The migration contract (section 9.7 / OQ7) makes that deletion conditional on
# a REAL run, because the "the join takes seconds" claim was never measured, and
# getting it backwards costs a SIGKILLed daily job that produces no delta at all
# — including no flag_history retention prune. Delete this file only once ONE
# real discovery.yml run has printed ALL FOUR of these, all within budget:
#
#   1. classification pass wall clock       <= 300 s   ("classification done in <n>ms")
#   2. whole discovery-batch.js run          <= 900 s   ("run complete ... <n>ms total")
#   3. peak RSS of the batch                 <= 6000 MB ("Maximum resident set size")
#   4. lakes segments actually indexed       <= 8e6     ("signals index built in <n>ms: ...")
#
# discovery.yml prints all four in its "Run discovery + classification (emit
# SQL)" step and keeps them in the discovery-batch-log artifact. Until then this
# file stays, as the escape hatch: if the join turns out to be slow, add
# --no-classify to discovery.yml's batch invocation and restore a schedule here.
# ============================================================================
#
# WHAT THIS FILE IS NOW. A MANUAL-ONLY, layer-based classify pass:
# scripts/discovery-batch.js --no-discovery over the same verified layer set
# discovery.yml uses. NO Overpass, NO upserts, NO reconciliation, NO deletes —
# it emits ONLY water_class UPDATEs.
#
# WHY IT COULD NOT SIMPLY BE LEFT UNTOUCHED. The Overpass transport it used to
# drive no longer exists (src/clients/overpass.js is deleted), and the CLI flags
# it used to pass — --classify-limit and --classify-budget-ms — were removed
# from scripts/discovery-batch.js, whose parseArgs THROWS on an unknown
# argument. The previous contents of this file would fail on the first line of
# every run. The workflow-side machinery those flags fed (CLASSIFY_LIMIT,
# CLASSIFY_BUDGET_MIN, the lastIndexOf(';') torn-tail truncation one-liner, the
# always()-vs-!cancelled() gating and the empty-delta short-circuit) is retired
# with them: the batch now writes its whole delta atomically at the end, so
# there is no torn-tail window for that belt to protect against.
#
# WHY THE SCHEDULE IS GONE. discovery.yml classifies the entire queue daily, in
# the same run that discovers it. An hourly duplicate here would re-download the
# whole layer set and rewrite the same water_class values 24 times a day for no
# product benefit. Restoring a schedule is a one-line change if the escape hatch
# above is ever needed.
#
# Requires the same CLOUDFLARE_API_TOKEN repository secret as discovery.yml, and
# likewise never runs npm install (npx --yes wrangler@<pin> only). It needs NO
# R2 credentials: the layers are public data read from https://map.swim.report.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the generated SQL to production D1 (false = dry run, artifact only)"
        type: boolean
        default: false

concurrency:
  # The SAME group as discovery.yml, deliberately. The old distinct group was
  # justified by disjoint columns — discovery wrote name/lat/lon/park_name plus
  # deletes, classify wrote only water_class*. That is no longer true: discovery
  # now emits water_class UPDATEs too, so the two runs must serialize rather than
  # race on the same column family and the same non-re-entrant D1 write.
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read

# Workflow-scoped so it covers EVERY deno invocation in EVERY job and step. The
# repo-root deno.lock is auto-discovered by Deno for every deno invocation in this
# repo, and without this Deno also wants a workspace.packageJson block for
# package.json's npm deps: "deno cache --frozen" then FAILS with "The lockfile is
# out of date", and a plain "deno run" SILENTLY REWRITES the checked-in deno.lock.
env:
  DENO_NO_PACKAGE_JSON: "1"

jobs:
  classify:
    runs-on: ubuntu-latest
    # Same budget as discovery.yml. This run does strictly less work (no upserts,
    # no reconciliation, no marine pass) over the same layer set.
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0e01552527359dfcce6edc27ebedb530
      DB_NAME: swim-report
      WRANGLER_VERSION: "4"
      LAYERS_DIR: ${{ runner.temp }}/layers
      # Defaults to a DRY RUN. This workflow exists to measure and to stand by; a
      # human who actually wants it to write to D1 says so at dispatch time.
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache Deno dependencies (frozen lockfile)
        run: deno cache --lock=deno.lock --frozen scripts/fetch-layers.js scripts/discovery-batch.js

      # No npm install (see discovery.yml) — every wrangler call is npx --yes wrangler@<pin>.

      - name: Fetch and verify the layer set
        # The only network-touching step, and it reads public data only.
        run: |
          set -euo pipefail
          deno run --lock=deno.lock --frozen --allow-net --allow-read --allow-write \
            scripts/fetch-layers.js --dest "$LAYERS_DIR"
          cat "$LAYERS_DIR/report.json"

      - name: Snapshot current beaches from D1
        # Read-only, and NARROWER than discovery.yml's snapshot: a --no-discovery
        # run reads only what buildClassifyQueue reads (id, osm_id, lat, lon,
        # water_class, water_class_version, water_class_attempts). name / park_name /
        # nws_zone / marine_zone are read by reconcileStaleRows and the marine pass,
        # neither of which runs here, so selecting them would only inflate the
        # response and raise truncation risk. The truncation guard is the same one
        # discovery.yml uses.
        run: |
          set -euo pipefail
          if ! npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --json \
            --command "SELECT id, osm_id, lat, lon, water_class, water_class_version, water_class_attempts FROM beaches" \
            > snapshot.json; then
            echo "::error::wrangler snapshot query failed (likely a bad CLOUDFLARE_API_TOKEN secret) — response below"
            cat snapshot.json
            exit 1
          fi
          echo "snapshot bytes: $(wc -c < snapshot.json)"
          total=$(npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --json \
            --command "SELECT COUNT(*) AS n FROM beaches" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r[0].results[0].n)})")
          snap=$(node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const rows=Array.isArray(p)?((p[0]&&p[0].results)||[]):[];console.log(rows.length)})" < snapshot.json)
          echo "snapshot rows: $snap / db rows: $total"
          if [ "$snap" != "$total" ]; then
            echo "::error::snapshot truncated ($snap of $total rows) — aborting so classification never runs on a partial table"
            exit 1
          fi

      - name: Run classification (emit SQL)
        # NO --allow-net, exactly as in discovery.yml: the batch itself makes zero
        # upstream requests, and the absence of the flag is what proves it.
        run: |
          set -euo pipefail
          # The isolated form of the contract 9.7 benchmark: with discovery off,
          # "Elapsed (wall clock)" and "Maximum resident set size" here bound the
          # classification pass ALONE, which is measurement 1 of the four in the
          # header above.
          /usr/bin/time -v deno run --lock=deno.lock --frozen \
            --v8-flags=--max-old-space-size=12288 \
            --allow-read --allow-write \
            scripts/discovery-batch.js \
            --layers "$LAYERS_DIR" \
            --snapshot snapshot.json \
            --out classify-delta.sql \
            --no-discovery 2>&1 | tee batch-timing.log
          echo "---- benchmark (contract 9.7) ----"
          grep -E "Elapsed \(wall clock\)|Maximum resident set size|classification done in|signals index built in|run complete" batch-timing.log || true
          echo "---- delta summary ----"
          # grep -c exits 1 on zero matches and this shell is bash -eo pipefail, so a
          # fully-drained queue (header-only delta, zero UPDATEs — a SUCCESS) would
          # fail the step without the || true.
          { grep -c ';' classify-delta.sql || true; } | xargs echo "statements:"
          head -n 20 classify-delta.sql

      - name: Upload SQL delta artifact
        uses: actions/upload-artifact@v7
        with:
          name: classify-delta-sql
          path: classify-delta.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload batch log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: classify-batch-log
          path: batch-timing.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply SQL to production D1
        # success()-gated, like discovery.yml: the batch writes its whole delta
        # atomically at the end, so there is no torn tail to truncate and no reason
        # for an always() belt. A delta carrying no UPDATEs applies as an idempotent
        # no-op (every emitted UPDATE sets absolute values).
        if: ${{ env.APPLY == 'true' }}
        run: |
          if ! npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --file classify-delta.sql; then
            echo "::error::wrangler apply failed (check CLOUDFLARE_API_TOKEN secret and delta SQL)"
            exit 1
          fi
