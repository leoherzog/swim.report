name: Tests

# Runs the vitest suite on every push and pull request.
#
# The install is deliberately not "npm ci". package.json's two runtime dependencies
# (@web.awesome.me/webawesome-pro and @awesome.me/kit-*) come from private registries
# whose tokens live in .dev.vars, and .npmrc routes those scopes through
# ${WEBAWESOME_NPM_TOKEN} / ${FONTAWESOME_NPM_TOKEN}. A plain npm ci here fails E401,
# and the fix is not to hand CI those secrets. Nothing under src/ or test/ imports
# either package: Web Awesome and Font Awesome load from a version-pinned CDN kit at
# runtime (see WA_KIT_BASE in src/frontend/render.js), and the local package exists
# only so a developer can read the bundled Web Awesome agent skill. So the job drops
# the two dependencies from the ephemeral checkout's manifest and installs the rest:
#
#   npm pkg delete dependencies    (npm's own CLI; touches only the runner's copy)
#   npm install                    (devDependencies only, still resolved from the
#                                   committed package-lock.json entries)
#
# npm ci cannot be used after that edit, because it requires package.json and
# package-lock.json to agree and the edit deliberately makes them disagree; npm
# install reconciles by pruning the two private trees, which is the intended effect.
# The devDependency versions still come from the lockfile.
#
# If this job ever fails with E401, the cause is a new import of a private package
# from src/ or test/ — fix the import, do not add the secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref. A newer push makes an in-flight run's answer irrelevant, and this
  # workflow writes nothing anywhere, so cancelling in progress is correct here.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Workflow-scoped so a new step cannot forget it. Without it Deno auto-discovers the
# repo-root deno.lock, wants a workspace.packageJson block for package.json's npm
# deps, and "deno check --frozen" fails with "The lockfile is out of date" while a
# plain "deno run" silently rewrites the checked-in lock.
env:
  DENO_NO_PACKAGE_JSON: "1"

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 24, not the 22 the wrangler jobs use: node:sqlite is unflagged from Node
          # 24, and test/demandOrdering.test.js skips with a printed reason when
          # node:sqlite is unavailable rather than failing. On Node 22 the suite would
          # stay green while quietly testing less.
          node-version: "24"
          cache: npm

      - name: Install devDependencies without the private registries
        # See the header. This edits only the runner's ephemeral checkout.
        run: |
          set -euo pipefail
          npm pkg delete dependencies
          npm install --no-audit --no-fund
          npx vitest --version

      - name: Run the vitest suite
        run: npm test

  deno-lock:
    # The offline batch and the build scripts run on Deno with a frozen lockfile, and
    # both delete-adjacent workflows depend on that staying true. Type-checking them
    # under --frozen here catches lock drift on the commit that causes it, rather than
    # inside the only job that can delete production rows.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint the workflow files
        # A YAML or ${{ }} typo in the other workflows otherwise surfaces only when the
        # cron fires, inside the jobs that delete production rows and publish to R2.
        # actionlint checks expressions, needs/uses references and runner labels
        # statically. Pinned as a content-addressed image, like every other third-party
        # dependency here.
        #
        # -shellcheck= disables the shellcheck integration. Enabling it is a deliberate
        # follow-up: it reports nine findings across three workflow files, and each has
        # to be fixed or given an inline "# shellcheck disable=" first, or every
        # workflow-touching PR goes red on pre-existing shell style.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the offline scripts against the frozen lockfile
        # Every offline script belongs here, including scripts/build-marine-zones.js,
        # which no workflow invokes: an operator runs it by hand about twice a year,
        # the cadence at which unchecked rot is most expensive.
        run: |
          set -euo pipefail
          deno check --lock=deno.lock --frozen \
            scripts/discovery-batch.js \
            scripts/fetch-layers.js \
            scripts/build-marine-zones.js \
            scripts/clip-layers.js \
            scripts/build-manifest.js \
            scripts/print-spat-bbox.js \
            scripts/print-flag-worthy-sql.js \
            scripts/fetch-wave-grids.js \
            scripts/sample-waves.js \
            scripts/build-wave-manifest.js \
            scripts/build-wave-kv.js

      - name: Assert deno.lock is unchanged
        # Belt to the --frozen brace. If a future Deno relaxes the refusal, the
        # working tree still tells the truth.
        run: |
          set -euo pipefail
          if ! git diff --quiet -- deno.lock; then
            echo "::error::deno.lock was rewritten by a deno invocation in this job — the frozen-lockfile guarantee is not in force"
            git diff -- deno.lock
            exit 1
          fi
          echo "deno.lock unchanged"

      - name: Assert no --allow-net reaches an offline-only script
        # The machine-enforced form of the offline-path contract: these scripts make no
        # upstream requests, and the absence of the permission flag is the proof.
        # Whole-line YAML comments are stripped first, since discovery.yml and waves.yml
        # state the rule in prose and would otherwise match, and backslash continuations
        # are joined so the comparison is per command rather than per source line: a
        # permission flag and a script name three lines apart are one invocation.
        # test.yml is excluded because this guard's own command line contains both
        # tokens.
        #
        # The list must name every pure-math offline script in both pipelines; a script
        # missing from it is one whose network silence nothing enforces.
        # scripts/fetch-layers.js, scripts/fetch-wave-grids.js and
        # scripts/build-marine-zones.js are the only network-capable offline scripts and
        # are deliberately absent.
        run: |
          set -euo pipefail
          joined=$(mktemp)
          for f in $(ls .github/workflows/*.yml | grep -v "/test\.yml$") package.json; do
            sed -e "s/^[[:space:]]*#.*$//" "$f" \
              | sed -e ":a" -e "/\\\\$/{N;s/\\\\[[:space:]]*\\n[[:space:]]*/ /;ta}" >> "$joined"
          done
          for script in discovery-batch clip-layers build-manifest print-spat-bbox \
                        print-flag-worthy-sql sample-waves build-wave-manifest build-wave-kv; do
            if grep -n -- "--allow-net" "$joined" | grep -- "$script"; then
              echo "::error::a $script.js invocation was given --allow-net — that script is pure local math over bytes on disk"
              exit 1
            fi
            echo "no --allow-net on any $script.js invocation"
          done

  worker-bundle:
    # Nothing else in CI bundles or boots the Worker: vitest imports src/index.js as a
    # plain ES module, which every valid and several invalid Workers satisfy, and the
    # deno-lock job never touches it. Two steps, catching different things:
    #
    #   deploy --dry-run  — a broken wrangler.toml, an unresolvable import, a missing
    #                       binding, the bundle size cap. Needs no auth.
    #   wrangler dev      — the workerd entrypoint contract. workerd rejects any named
    #                       export of the entry module that is not a function or an
    #                       ExportedHandler, and dry-run does not catch it: a bare
    #                       "export const FOO = 123" in src/index.js bundles clean and
    #                       then kills the isolate at startup. This is the only step in
    #                       the repo that sees that. test/workerExports.test.js stays
    #                       the fast static guard on the one known instance.
    #
    # No npm install anywhere: package.json's two runtime dependencies come from private
    # registries this job has no tokens for, so wrangler is fetched on its own through
    # npx, as discovery.yml and waves.yml do it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned to the wrangler major line, matching package.json's ^4 and the two
      # other wrangler-using workflows.
      WRANGLER_VERSION: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Bundle the Worker
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run

      - name: Boot the Worker under workerd
        # wrangler dev runs workerd locally against emulated bindings and contacts no
        # Cloudflare API, so this needs no secrets. Any HTTP status proves the isolate
        # started and accepted the entry module; the response body is not the subject
        # and must never become one, since request behaviour is vitest's job.
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" dev --port 8787 --inspector-port 9229 > dev.log 2>&1 &
          dev_pid=$!
          code=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              break
            fi
            sleep 2
          done
          kill "$dev_pid" 2>/dev/null || true
          wait "$dev_pid" 2>/dev/null || true
          cat dev.log
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::the Worker did not boot under workerd"
            exit 1
          fi
          echo "workerd answered with HTTP $code"
