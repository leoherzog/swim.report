name: Tests

# Runs the vitest suite on every push and pull request.
#
# The install is deliberately not "npm ci". Two of package.json's runtime dependencies
# (@web.awesome.me/webawesome-pro and @awesome.me/kit-*) come from private registries
# whose tokens live in .dev.vars, and .npmrc routes those scopes through
# ${WEBAWESOME_NPM_TOKEN} / ${FONTAWESOME_NPM_TOKEN}. A plain npm ci here fails E401,
# and the fix is not to hand CI those secrets. Nothing under src/ or test/ imports
# either package: Web Awesome and Font Awesome load from a version-pinned CDN kit at
# runtime (see WA_KIT_BASE in src/frontend/render.js), and the local package exists
# only so a developer can read the bundled Web Awesome agent skill. So the job drops
# those two by name from the ephemeral checkout's manifest and installs the rest,
# including suncalc, which src/frontend/sun.js imports and the Worker bundles:
#
#   npm pkg delete 'dependencies[<private>]' ...  (touches only the runner's copy)
#   npm install                    (still resolved from the committed package-lock.json)
#
# npm ci cannot be used after that edit, because it requires package.json and
# package-lock.json to agree and the edit deliberately makes them disagree; npm
# install reconciles by pruning the two private trees, which is the intended effect.
# Every remaining version still comes from the lockfile.
#
# If this job ever fails with E401, the cause is a new import of a private package
# from src/ or test/ — fix the import, do not add the secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref. A newer push makes an in-flight run's answer irrelevant, and this
  # workflow writes nothing anywhere, so cancelling in progress is correct here.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 26, the floor package.json's engines field sets and the version every
          # workflow runs. test/demandOrdering.test.js needs node:sqlite and skips with
          # a printed reason when it is unavailable rather than failing, so an older
          # Node would stay green while quietly testing less.
          node-version: 26
          cache: npm

      - name: Install dependencies without the private registries
        # See the header. This edits only the runner's ephemeral checkout.
        run: |
          set -euo pipefail
          npm pkg delete 'dependencies[@web.awesome.me/webawesome-pro]' 'dependencies[@awesome.me/kit-ddd41b2d81]'
          npm install --no-audit --no-fund
          npx vitest --version

      - name: Run the vitest suite
        run: npm test

      - name: Load every offline script under plain Node
        # vitest resolves modules more leniently than node does, and the workflows run
        # plain node, so an unresolvable import would otherwise surface only when a
        # cron fires. Every offline script belongs here, including
        # scripts/build-marine-zones.js, which no workflow invokes: an operator runs
        # it by hand about twice a year, the cadence at which unchecked rot is most
        # expensive. Importing never runs main(), which import.meta.main gates.
        run: |
          set -euo pipefail
          for script in discovery-batch fetch-layers build-marine-zones clip-layers \
                        build-manifest print-spat-bbox print-flag-worthy-sql fetch-wave-grids \
                        sample-waves build-wave-manifest build-wave-sql; do
            node --input-type=module -e "await import('./scripts/$script.js')"
            echo "scripts/$script.js loads"
          done

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint the workflow files
        # A YAML or ${{ }} typo in the other workflows otherwise surfaces only when the
        # cron fires, inside the jobs that delete production rows and publish to R2.
        # actionlint checks expressions, needs/uses references and runner labels
        # statically. Pinned as a content-addressed image, like every other third-party
        # dependency here.
        #
        # -shellcheck= disables the shellcheck integration. Enabling it is a deliberate
        # follow-up: it reports nine findings across three workflow files, and each has
        # to be fixed or given an inline "# shellcheck disable=" first, or every
        # workflow-touching PR goes red on pre-existing shell style.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

      - name: Assert no offline script runs outside its permission grants
        # The machine-enforced form of the offline-path contract. Every offline script
        # runs under node --permission, which denies network, child processes and any
        # filesystem path not granted, so the absence of a grant flag is the proof.
        # Whole-line YAML comments are stripped first, backslash continuations are
        # joined, and each line is split at && || ; | and $( so the check is per
        # command: a grant flag and a script name three lines apart are one
        # invocation, and two commands on one line are two. Only flags between node
        # and the script path count, since anything after it is the script's own.
        # test.yml is excluded because this guard's own lines contain the tokens.
        #
        # Every node scripts/<name>.js invocation must carry --permission, except
        # the three local tools that drive wrangler through npx, which would inherit
        # the sandbox through NODE_OPTIONS. An unclassified script fails, as does a
        # listed script that no longer exists or is never invoked, so a rename cannot
        # silently drop out. NODE_OPTIONS is refused outright, since it widens the
        # grants of every node process it reaches.
        #
        # The --allow-net list names every pure-math offline script in both
        # pipelines. scripts/fetch-layers.js, scripts/fetch-wave-grids.js and
        # scripts/build-marine-zones.js are the only network-capable offline scripts.
        # scripts/build-wave-sql.js belongs in the list even though a later shell
        # step applies its delta to production D1: the emitter itself reads bytes on
        # disk and writes a file, and this guard is what keeps that true.
        #
        # The --allow-child-process list names every script in the wave pipeline,
        # the network-capable fetcher included: GDAL runs in the workflow shell, so no
        # wave script may spawn a subprocess. The layer build's build-manifest.js is
        # not in it, since that script legitimately runs ogrinfo and osmium.
        run: |
          set -euo pipefail
          joined=$(mktemp)
          for f in $(ls .github/workflows/*.yml | grep -v "/test\.yml$") package.json; do
            sed -e "s/^[[:space:]]*#.*$//" "$f" \
              | sed -e ":a" -e "/\\\\$/{N;s/\\\\[[:space:]]*\\n[[:space:]]*/ /;ta}" >> "$joined"
          done
          if grep -n "NODE_OPTIONS" "$joined"; then
            echo "::error::NODE_OPTIONS would widen the permission grants of every node process it reaches"
            exit 1
          fi
          node_cmd="(^|[^-[:alnum:]_./])node[[:space:]]"
          commands=$(mktemp)
          sed -e 's/&&/\n/g; s/||/\n/g; s/;/\n/g; s/|/\n/g; s/\$(/\n/g' "$joined" \
            | grep -E "${node_cmd}.*scripts/[a-z0-9-]+\.js" > "$commands" || true
          failed=0
          while IFS= read -r cmd; do
            name=$(printf '%s\n' "$cmd" | sed -E 's/.*scripts\/([a-z0-9-]+)\.js.*/\1/')
            flags=$(printf '%s\n' "$cmd" | sed -E "s/.*${node_cmd}(.*)scripts\/[a-z0-9-]+\.js.*/\2/")
            case "$name" in
              snapshot-d1|apply-local-sql|build-brand-assets) continue ;;
              discovery-batch|clip-layers|build-manifest|print-spat-bbox|print-flag-worthy-sql) ;;
              sample-waves|build-wave-manifest|build-wave-sql) ;;
              fetch-layers|fetch-wave-grids|build-marine-zones) ;;
              *)
                echo "::error::$name.js is not classified in this guard; add it to the pure-math, network or unsandboxed list"
                failed=1 ;;
            esac
            if ! printf '%s\n' "$flags" | grep -qE -- "(^|[[:space:]])--permission([[:space:]]|$)"; then
              echo "::error::a $name.js invocation runs without --permission: $cmd"
              failed=1
            fi
            case " discovery-batch clip-layers build-manifest print-spat-bbox print-flag-worthy-sql sample-waves build-wave-manifest build-wave-sql " in
              *" $name "*)
                if printf '%s\n' "$flags" | grep -q -- "--allow-net"; then
                  echo "::error::a $name.js invocation was given --allow-net — that script is pure local math over bytes on disk"
                  failed=1
                fi ;;
            esac
            case " fetch-wave-grids print-flag-worthy-sql sample-waves build-wave-manifest build-wave-sql " in
              *" $name "*)
                if printf '%s\n' "$flags" | grep -q -- "--allow-child-process"; then
                  echo "::error::a $name.js invocation was given --allow-child-process — GDAL runs in the workflow shell, never from a wave-pipeline script"
                  failed=1
                fi ;;
            esac
          done < "$commands"
          for script in discovery-batch clip-layers build-manifest print-spat-bbox print-flag-worthy-sql \
                        fetch-layers fetch-wave-grids sample-waves build-wave-manifest build-wave-sql; do
            count=$(grep -c "scripts/$script\.js" "$commands" || true)
            if [ ! -f "scripts/$script.js" ]; then
              echo "::error::scripts/$script.js does not exist, so a renamed script has dropped out of this guard"
              failed=1
            elif [ "$count" -eq 0 ]; then
              echo "::error::no node invocation of scripts/$script.js found, so a renamed script has dropped out of this guard"
              failed=1
            else
              echo "$script.js: $count invocation(s) checked"
            fi
          done
          exit "$failed"

  worker-bundle:
    # Nothing else in CI bundles or boots the Worker: vitest imports src/index.js as a
    # plain ES module, which every valid and several invalid Workers satisfy, and the
    # workflow-lint job never touches it. Two steps, catching different things:
    #
    #   deploy --dry-run  — a broken wrangler.toml, an unresolvable import, a missing
    #                       binding, the bundle size cap. Needs no auth.
    #   wrangler dev      — the workerd entrypoint contract. workerd rejects any named
    #                       export of the entry module that is not a function or an
    #                       ExportedHandler, and dry-run does not catch it: a bare
    #                       "export const FOO = 123" in src/index.js bundles clean and
    #                       then kills the isolate at startup. This is the only step in
    #                       the repo that sees that. test/workerExports.test.js stays
    #                       the fast static guard on the one known instance.
    #
    # The bundle resolves suncalc from node_modules, so this job installs the way the
    # vitest job does, minus the two private-registry packages it has no tokens for.
    # wrangler is still fetched on its own through npx, as discovery.yml and waves.yml
    # do it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned to the wrangler major line, matching package.json's ^4 and the two
      # other wrangler-using workflows.
      WRANGLER_VERSION: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies without the private registries
        # See the header. This edits only the runner's ephemeral checkout.
        run: |
          set -euo pipefail
          npm pkg delete 'dependencies[@web.awesome.me/webawesome-pro]' 'dependencies[@awesome.me/kit-ddd41b2d81]'
          npm install --no-audit --no-fund

      - name: Bundle the Worker
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run

      - name: Boot the Worker under workerd
        # wrangler dev runs workerd locally against emulated bindings and contacts no
        # Cloudflare API, so this needs no secrets. Any HTTP status proves the isolate
        # started and accepted the entry module; the response body is not the subject
        # and must never become one, since request behaviour is vitest's job.
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" dev --port 8787 --inspector-port 9229 > dev.log 2>&1 &
          dev_pid=$!
          code=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              break
            fi
            sleep 2
          done
          kill "$dev_pid" 2>/dev/null || true
          wait "$dev_pid" 2>/dev/null || true
          cat dev.log
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::the Worker did not boot under workerd"
            exit 1
          fi
          echo "workerd answered with HTTP $code"
