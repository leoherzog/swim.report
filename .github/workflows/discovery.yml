name: Beach discovery

# Discovery, water-body classification and the offline marine_zone pass, as pure
# local math over the prebuilt layers build-layers.yml publishes: a verified layer
# set downloaded over plain HTTPS, then scripts/discovery-batch.js with no network
# permission at all. Output is one idempotent .sql delta bulk-loaded into production
# D1, carrying upserts, stale-row reconciliation (the only delete path), water_class
# UPDATEs, flag_history retention, sync_meta and change-only marine_zone UPDATEs.
#
# Classification runs in the same run that discovers a beach, so the
# FLAG_WORTHY_WATER_SQL fail-open window — an unclassified beach served live with an
# estimated flag card — is zero rather than hours.
#
# Delete safety: reconciliation and classification both run only under a verified
# manifest (src/layerManifest.js). A partial view of OSM must never read as "gone
# from OSM", and must never decide inland either. Two proportional rails then apply
# to the proposed delete set: the global max(10, 5% of candidates) and the per-region
# rail.
#
# Requires one repository secret, CLOUDFLARE_D1_EDIT_TOKEN. No R2 credentials, since
# the layers are public data from https://map.swim.report — a blast-radius reduction
# for the only job that can delete production rows — and no npm private-registry
# tokens, because it never runs npm install in the repo.

on:
  # Daily. GitHub's scheduler defers crons by hours, which does not matter here: the
  # layers in R2 are days old by design, so a late run is indistinguishable from an
  # on-time one.
  schedule:
    - cron: "47 8 * * *"
  # Consume a fresh layer set immediately rather than waiting for the next deferred
  # schedule: workflow_run fires on a real event, not the scheduler queue.
  workflow_run:
    workflows: ["Build layers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the generated SQL to production D1 (false = dry run, artifact only)"
        type: boolean
        default: true

concurrency:
  # The D1 write is not safely re-entrant, and one delta carries both the discovery
  # and the classification column families, so two runs must never overlap.
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read

# Workflow-scoped so it covers every deno invocation in every job and step. Deno
# auto-discovers the repo-root deno.lock, and without this it also wants a
# workspace.packageJson block for package.json's npm deps: "deno cache --frozen" then
# fails with "The lockfile is out of date", and a plain "deno run" silently rewrites
# the checked-in lock. On the one job that can delete production rows, a silently
# rewritten lock is a retired guarantee.
env:
  DENO_NO_PACKAGE_JSON: "1"

jobs:
  discover:
    # Skip the workflow_run path when the build failed or was cancelled.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # A realistic run is 5-12 minutes, so 45 leaves several times the headroom the
    # North America expansion needs without letting a wedged job burn two hours.
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_EDIT_TOKEN }}
      # A minimal D1-only API token cannot enumerate GET /accounts to auto-discover
      # the account, so wrangler needs it explicitly. Account IDs are not secret.
      CLOUDFLARE_ACCOUNT_ID: 0e01552527359dfcce6edc27ebedb530
      DB_NAME: swim-report
      # Pinned to the wrangler major line, matching package.json's ^4, so the
      # unattended job gets 4.x fixes but a future wrangler 5 can never silently
      # change flags or --file parsing under a scheduled run.
      WRANGLER_VERSION: "4"
      # workflow_dispatch inputs are absent on scheduled and workflow_run runs.
      APPLY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'true' || inputs.apply }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The one job that can delete production rows must not resolve an unpinned
      # transitive npm tree on every invocation. --frozen refuses any lockfile drift,
      # and an npm outage fails here, loudly, before any D1 read.
      - name: Cache Deno dependencies (frozen lockfile)
        run: deno cache --lock=deno.lock --frozen scripts/fetch-layers.js scripts/discovery-batch.js

      # No npm install here: it would reify package.json's private deps, whose
      # registry tokens this job lacks, and fail E401. Every wrangler call goes
      # through npx --yes wrangler@<pin>, which fetches only wrangler.

      - name: Fetch and verify the layer set
        # The only network-touching step. It pins layers/current.json once — so a
        # build completing mid-run cannot mix two sets — downloads only from that
        # immutable prefix, verifies every sha256 and byte length against the
        # manifest, writes report.json, and exits 1 on any fatal conjunct, so an
        # undecodable set never reaches the batch.
        run: |
          set -euo pipefail
          # LAYERS_DIR is resolved here, not in the job-level env block: the runner
          # context is unavailable to jobs.<id>.env, so a ${{ runner.temp }} value
          # there makes the whole workflow file invalid and the run fails in 0s with
          # "workflow file issue" before a job exists. RUNNER_TEMP is present in every
          # step, and $GITHUB_ENV carries the resolved value onward, where a job-level
          # env literal would never be re-expanded by the shell.
          LAYERS_DIR="$RUNNER_TEMP/layers"
          echo "LAYERS_DIR=$LAYERS_DIR" >> "$GITHUB_ENV"
          deno run --lock=deno.lock --frozen --allow-net --allow-read --allow-write \
            scripts/fetch-layers.js --dest "$LAYERS_DIR"
          cat "$LAYERS_DIR/report.json"

      - name: Snapshot current beaches from D1
        # Read-only, and guarded against a silently truncated snapshot — D1's --json
        # response is size-capped — by comparing the row count to SELECT COUNT(*).
        #
        # Columns are the union of what discovery, classify and marine read. The 11
        # columns raise truncation risk on the only delete-bearing snapshot: watch the
        # "snapshot bytes" line. A paginated LIMIT/OFFSET snapshot is the planned fix
        # and is required before the North America expansion. It is also why
        # discoverFromLayers applies pointInAnyRegion: without it the union -spat
        # rectangle would add thousands of continental-interior inland-lake rows and
        # this guard would abort the only delete path.
        run: |
          set -euo pipefail
          # --json writes API errors to stdout, so a naive redirect swallows them and
          # the step fails with a blank log.
          if ! npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --json \
            --command "SELECT id, osm_id, name, lat, lon, park_name, nws_zone, marine_zone, water_class, water_class_version, water_class_attempts FROM beaches" \
            > snapshot.json; then
            echo "::error::wrangler snapshot query failed (likely a bad CLOUDFLARE_D1_EDIT_TOKEN secret) — response below"
            cat snapshot.json
            exit 1
          fi
          echo "snapshot bytes: $(wc -c < snapshot.json)"
          total=$(npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --json \
            --command "SELECT COUNT(*) AS n FROM beaches" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r[0].results[0].n)})")
          snap=$(node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const rows=Array.isArray(p)?((p[0]&&p[0].results)||[]):[];console.log(rows.length)})" < snapshot.json)
          echo "snapshot rows: $snap / db rows: $total"
          if [ "$snap" != "$total" ]; then
            echo "::error::snapshot truncated ($snap of $total rows) — aborting so reconciliation never runs on a partial table"
            exit 1
          fi

      - name: Run discovery + classification (emit SQL)
        # No --allow-net: the machine-enforced form of the offline-path contract. Any
        # --allow-net on a discovery-batch.js invocation in this repo is a leftover
        # upstream call, findable by one grep.
        run: |
          set -euo pipefail
          # GeoJSON in a JS heap costs many times its packed FGB footprint, and OOM
          # is fail-safe — non-zero exit, no delta — but invisible until it happens.
          # Raise the ceiling explicitly and log peak RSS so headroom is observable
          # before it is exceeded.
          #
          # "2>&1 | tee", never "2> file": the batch logs to stderr by design, so
          # redirecting stderr to a file would hide the layer load, the delete-rail
          # decisions and the classification counts on every successful run, which is
          # when they need reading. pipefail keeps a batch failure a step failure.
          #
          # This is also the benchmark instrument. Keep emitting these lines: they are
          # the early warning for the North America expansion. The limits are 300 s
          # for the classification pass, 900 s for the whole batch, 6000 MB peak RSS
          # and 8e6 indexed lake segments.
          /usr/bin/time -v deno run --lock=deno.lock --frozen \
            --v8-flags=--max-old-space-size=12288 \
            --allow-read --allow-write \
            scripts/discovery-batch.js \
            --layers "$LAYERS_DIR" \
            --snapshot snapshot.json \
            --out discovery-delta.sql \
            --marine-zones data/marine-zones-greatlakes.json 2>&1 | tee batch-timing.log
          echo "---- benchmark ----"
          grep -E "Elapsed \(wall clock\)|Maximum resident set size|classification done in|signals index built in|run complete" batch-timing.log || true
          echo "---- delta summary ----"
          # || true: under set -euo pipefail a grep -c that finds nothing fails the
          # step, and a delta with zero statements is a legitimate outcome to report.
          { grep -c ';' discovery-delta.sql || true; } | xargs echo "statements:"
          head -n 20 discovery-delta.sql

      - name: Upload SQL delta artifact
        uses: actions/upload-artifact@v7
        with:
          name: discovery-delta-sql
          path: discovery-delta.sql
          retention-days: 14

      - name: Upload batch log artifact
        # The benchmark numbers and every rail decision live here, kept as an artifact
        # so a run that has scrolled out of the live log view can still be read.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: discovery-batch-log
          path: batch-timing.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply SQL to production D1
        # success()-gated on purpose. The batch writes its whole delta atomically at
        # the end, so the outcome is binary and there is no torn-tail window: no
        # always() belt, no truncation step. A degraded run — readable layers that are
        # not provably a complete view — still exits 0 and emits upserts, retention,
        # marine and sync_meta with no deletes and no water_class UPDATEs; that delta
        # is valid to apply and idempotent.
        if: ${{ env.APPLY == 'true' }}
        run: |
          if ! npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DB_NAME" --remote --file discovery-delta.sql; then
            echo "::error::wrangler apply failed (check CLOUDFLARE_D1_EDIT_TOKEN secret and delta SQL)"
            exit 1
          fi
