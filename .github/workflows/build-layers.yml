name: Build layers

# Builds the prebuilt OSM spatial layers that scripts/discovery-batch.js consumes,
# and publishes them to the swim-report R2 bucket (public at https://map.swim.report).
#
# Not delete-bearing: this job never touches D1. A failed or refused build leaves the
# previous good layer set live and discovery keeps running on slightly older OSM data,
# which is delete-safe because an older extract is over-inclusive — it still contains
# beaches OSM has since removed and lacks only beaches OSM has since added, which D1
# also lacks.
#
# Publication is atomic by construction: every layer is written under an immutable
# per-build prefix that nobody is reading, and only then is the single small
# layers/current.json pointer overwritten. A reader can never see a torn set.
#
# Requires two repository secrets, the S3-API key pair on the swim-report bucket:
# CLOUDFLARE_R2_ACCESS_KEY and CLOUDFLARE_R2_SECRET_ACCESS_KEY. It needs no
# Cloudflare API token and no npm registry tokens, since it never runs npm install in
# the repo root, which would reify package.json's private deps and fail E401.

on:
  # Twice weekly. Geofabrik publishes daily and beaches change slowly, so this loses
  # at most a few days of freshness while downloading a fraction of the bytes from a
  # free service the project depends on. Two slots rather than one because GitHub
  # skips cron occurrences rather than merely deferring them: on a weekly cron one
  # skipped occurrence is a 14-day gap, exactly MAX_SOURCE_AGE_DAYS. Two slots
  # against a 21-day horizon means a single miss can never trip the tripwire.
  schedule:
    - cron: "41 6 * * 0"
    - cron: "41 6 * * 3"
  workflow_dispatch:
    inputs:
      publish:
        description: "Write layers/current.json (false = build and upload the prefix only, do not make it live)"
        type: boolean
        default: true
      allow_shrink:
        description: "Demote shrink-ratio refusals to warnings (use only for a KNOWN legitimate shrink)"
        type: boolean
        default: false
      force_publish:
        description: "Publish even when build-manifest.js withheld auto-publish (bootstrap / unseeded floors). Read the manifest FIRST."
        type: boolean
        default: false

concurrency:
  # Two builds writing the same pointer is the one race this design cannot absorb.
  group: build-layers
  cancel-in-progress: false

permissions:
  contents: read

# Workflow-scoped so it covers every deno invocation in every job and step. Deno
# auto-discovers the repo-root deno.lock, and without this it also wants a
# workspace.packageJson block for package.json's npm deps: "deno check --frozen" then
# fails with "The lockfile is out of date", and a plain "deno run" silently rewrites
# the checked-in lock, retiring the frozen-lock guarantee that keeps the only
# delete-adjacent pipeline off an unpinned transitive npm tree.
env:
  DENO_NO_PACKAGE_JSON: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # A realistic run is 60-120 minutes, dominated by the extract download and the
    # osmium/ogr2ogr passes. 180 leaves margin under the 6 h job cap without letting
    # a hung download burn hours.
    timeout-minutes: 180
    env:
      # The bucket is swim-report with a hyphen. The zone is swim.report with a dot
      # and the public R2 domain is map.swim.report, so the dotted form reads
      # naturally and is wrong: R2 answers AccessDenied rather than NoSuchBucket for
      # a bucket a token cannot see, so the wrong name looks exactly like a bad
      # secret.
      R2_BUCKET: swim-report
      R2_PUBLIC_BASE: https://map.swim.report
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://0e01552527359dfcce6edc27ebedb530.r2.cloudflarestorage.com
      # The AWS CLI defaults to sending CRC32 integrity headers, which R2 has
      # answered "not implemented"; when_required is Cloudflare's documented
      # mitigation.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_MAX_ATTEMPTS: "5"
      AWS_RETRY_MODE: standard
      AWS_PAGER: ""
      PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
      ALLOW_SHRINK: ${{ github.event_name == 'schedule' && 'false' || inputs.allow_shrink }}
      # Never settable on a schedule. scripts/build-manifest.js withholds
      # auto-publish exactly when the evidence for publishing is missing: no previous
      # manifest to ratio against, or a floors entry that is absent or still status
      # "bootstrap" for this regionsDigest. A human reads the manifest and dispatches
      # with this on; a scheduler never decides that.
      FORCE_PUBLISH: ${{ github.event_name == 'schedule' && 'false' || inputs.force_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Resolve the flatgeobuf tree from the committed deno.lock once, explicitly,
      # and fail loudly if it drifts, rather than letting a pipeline that feeds the
      # delete path resolve an unpinned transitive npm tree on every invocation.
      - name: Cache Deno dependencies (frozen lockfile)
        run: deno cache --lock=deno.lock --frozen scripts/clip-layers.js scripts/build-manifest.js scripts/print-spat-bbox.js

      # Reclaim runner disk. The per-country sequential plan peaks around 13.3 GB in
      # the PBF stage, against a documented 14 GB, and $WORK/raw, $WORK/raw-lines and
      # $WORK/gdaltmp are a second stage that grows continentally; every ogr2ogr step
      # prints df before and after so the real peak stays a measurement. The 40 GB
      # floor asserted below is sized for both stages: Actions commits only the 14 GB
      # and anything above it is best effort, so this step buys the margin rather
      # than betting on an observation.
      # tool-cache is deliberately not reclaimed: it holds the Node and Deno the
      # later steps need.
      - name: Reclaim disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Assert usable disk
        run: |
          set -euo pipefail
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "free disk: ${avail}G"
          if [ "$avail" -lt 40 ]; then
            echo "::error::only ${avail}G free — this runner cannot hold us-latest.osm.pbf plus output"
            exit 1
          fi

      - name: Install osmium-tool and GDAL
        run: |
          set -euo pipefail
          sudo apt-get update
          # Timed so the apt cost stays visible in the log. --no-install-recommends
          # is deliberate: GDAL's recommends carry extra format drivers this pipeline
          # does not use, so if an "unsupported format" error ever appears at ogr2ogr
          # time, drop the flag first.
          time sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin
          osmium --version
          ogrinfo --version

      - name: Configure aws CLI for R2
        run: |
          set -euo pipefail
          mkdir -p ~/.aws
          # Path-style, pinned deliberately. swim-report carries no dot, so the
          # wildcard certificate for *.r2.cloudflarestorage.com would cover
          # virtual-hosted addressing today. It is pinned anyway because this is the
          # only publish path and path-style is what R2 documents: a future rename to
          # a dotted bucket would produce a host that wildcard does not cover, and
          # the failure would be a TLS error at upload time rather than anything
          # resembling a naming mistake.
          cat > ~/.aws/config <<'AWSCFG'
          [default]
          s3 =
              addressing_style = path
              multipart_threshold = 64MB
              multipart_chunksize = 64MB
              max_concurrent_requests = 8
          AWSCFG
          aws --version
          # Cheap fail-fast so a bad secret surfaces now, not after an hour of
          # osmium work.
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --max-items 1 > /dev/null
          echo "R2 credentials and endpoint verified"

      - name: Prepare workspace and fetch the previous manifest
        run: |
          set -euo pipefail
          # WORK is resolved here, not in the job-level env block: the runner
          # context is unavailable to jobs.<id>.env, so a ${{ runner.temp }} value
          # there makes the whole workflow file invalid and the run fails in 0s with
          # "workflow file issue" before a job exists. RUNNER_TEMP is present in every
          # step, and $GITHUB_ENV carries the resolved value onward, where a job-level
          # env literal would never be re-expanded by the shell.
          WORK="$RUNNER_TEMP/osm"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          # $WORK/raw and $WORK/raw-lines are deliberately not created here. A
          # suffix-less FlatGeobuf output path makes the driver write a directory of
          # one .fgb per layer and create that directory itself; if the path already
          # exists it refuses with "It seems a file system object called '<path>'
          # already exists" and ogr2ogr exits non-zero immediately.
          mkdir -p "$WORK/pbf" "$WORK/filtered" "$WORK/layers" "$WORK/verify" "$WORK/gdaltmp"
          # With CPL_TMPDIR unset, the GDAL OSM driver creates its node index temp
          # file in the current working directory and unlinks it immediately, so du,
          # ls and df report nothing while it eats gigabytes. When it runs out of
          # space GDAL emits a flood of "ERROR 1: Cannot read node <id>" and then
          # returns an empty result with a zero exit status. Setting CPL_TMPDIR
          # explicitly is not optional.
          echo "CPL_TMPDIR=$WORK/gdaltmp" >> "$GITHUB_ENV"
          echo "OSM_COMPRESS_NODES=YES" >> "$GITHUB_ENV"
          # Previous manifest, for the shrink-ratio and per-region floors. Absent on
          # the first build, where build-manifest.js skips the ratio checks and
          # withholds auto-publish.
          if curl -sfL --retry 3 "$R2_PUBLIC_BASE/layers/current.json?cb=$GITHUB_RUN_ID" -o "$WORK/prev-current.json"; then
            prev_prefix=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).prefix)" "$WORK/prev-current.json")
            echo "previous prefix: $prev_prefix"
            curl -sfL --retry 3 "$R2_PUBLIC_BASE/$prev_prefix/manifest.json" -o "$WORK/prev-manifest.json" || rm -f "$WORK/prev-manifest.json"
          else
            echo "no previous pointer — this is a bootstrap build"
          fi

      # Per-country sequential download, md5 verify, tags-filter, delete. Deleting
      # each source .pbf before the next download is what keeps the peak at one source
      # file plus the accumulated filtered output.
      - name: Download, verify and filter extracts
        run: |
          set -euo pipefail
          cd "$WORK/pbf"
          BASE=https://download.geofabrik.de/north-america
          # Resolve one dated, immutable snapshot for every country. -latest is
          # mutable and Geofabrik regenerates around 21:00 CET; a scheduler deferral
          # plus a many-hour sequential download can straddle that boundary and leave
          # the .pbf and its .md5 from different snapshots.
          DATE=""
          for back in 0 1 2; do
            d=$(date -u -d "-$back day" +%y%m%d)
            if curl -fsIL -o /dev/null "$BASE/us-$d.osm.pbf.md5"; then DATE="$d"; break; fi
          done
          if [ -z "$DATE" ]; then
            echo "::error::no dated Geofabrik snapshot found for the last 3 days — refusing to fall back to a mutable -latest URL"
            exit 1
          fi
          echo "geofabrik snapshot date: $DATE"
          : > "$WORK/sources.tsv"
          for c in us canada mexico; do
            f="$c-$DATE.osm.pbf"
            # -f fails the step on an HTTP error instead of writing an HTML error
            # page into a .pbf. -L is mandatory: download.geofabrik.de 302-redirects
            # to mirrors and a request without it returns no body.
            # --speed-limit/--speed-time detect a stalled stream, which --retry
            # cannot, since --retry acts on completed transfers that errored; without
            # them a hung socket burns the whole job timeout. -C - resumes rather
            # than restarting a multi-gigabyte transfer from zero.
            curl -fSL --retry 5 --retry-all-errors --retry-delay 5 -C - \
              --speed-limit 102400 --speed-time 120 --max-time 5400 \
              -o "$f" "$BASE/$f"
            curl -fSL --retry 5 --retry-all-errors --retry-delay 5 -o "$f.md5" "$BASE/$f.md5"
            # The sidecar carries a bare basename, hence the cd above.
            md5sum -c "$f.md5"
            # The md5 pair is not merely checked here, it is recorded. Anything but
            # an explicit sourcesVerified true in the manifest makes
            # src/layerManifest.js treat the published set as an incomplete view of
            # OSM, stopping both reconciliation deletes and classification, so this
            # evidence file is what lets the layer set decide anything at all.
            published=$(cut -d' ' -f1 < "$f.md5")
            observed=$(md5sum "$f" | cut -d' ' -f1)
            ts=$(osmium fileinfo -j "$f" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).header.option.osmosis_replication_timestamp)})")
            bytes=$(stat -c '%s' "$f")
            echo "$ts" >> "$WORK/timestamps.raw"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$c" "$f" "$published" "$observed" "$ts" "$bytes" >> "$WORK/sources.tsv"
            # $GITHUB_WORKSPACE-absolute: a relative path resolves under $WORK/pbf
            # rather than the checkout, and the step dies on the first country.
            osmium tags-filter -v --overwrite \
              --expressions="$GITHUB_WORKSPACE/.github/build/expressions.txt" \
              -o "$WORK/filtered/$f" "$f"
            rm -f "$f" "$f.md5"
            df -h "$WORK" | tail -1
          done
          sort -u "$WORK/timestamps.raw" > "$WORK/timestamps.txt"
          if [ "$(wc -l < "$WORK/timestamps.txt")" -ne 1 ]; then
            echo "::error::extracts span more than one Geofabrik snapshot — osmium merge is documented as incorrect across differing data timestamps"
            cat "$WORK/timestamps.txt"
            exit 1
          fi
          SNAP=$(cat "$WORK/timestamps.txt")
          # Without this, an absent header option prints the literal "undefined",
          # the single-line assertion above passes, and sourceAgeDays becomes NaN,
          # which makes every future discovery run unable to delete or classify.
          case "$SNAP" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T*) : ;;
            *) echo "::error::osmosis_replication_timestamp is not ISO-8601: '$SNAP'"; exit 1 ;;
          esac
          # Emit the download-completeness evidence scripts/build-manifest.js
          # verifies. Built from a TSV rather than appended JSON, so a mid-loop
          # failure can never leave a half-written array that parses.
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync(process.argv[1], 'utf8').split('\n').filter(function (l) { return l !== ''; });
            const out = lines.map(function (l) {
              const p = l.split('\t');
              return {
                name: p[0],
                file: p[1],
                md5Published: p[2],
                md5Observed: p[3],
                osmosisReplicationTimestamp: p[4],
                bytes: Number(p[5])
              };
            });
            fs.writeFileSync(process.argv[2], JSON.stringify(out, null, 2) + '\n');
            console.log('sources recorded: ' + out.length);
          " "$WORK/sources.tsv" "$WORK/sources.json"
          cat "$WORK/sources.json"
          echo "OSM_SNAPSHOT=$SNAP" >> "$GITHUB_ENV"
          echo "OSM_SNAPSHOT_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Merge filtered extracts
        run: |
          set -euo pipefail
          # Merge after filtering, never before: an order of magnitude less data.
          # Inputs must be sorted by type/id/version, which Geofabrik files are and
          # tags-filter preserves, and objects in two extracts appear exactly once.
          osmium merge --overwrite -o "$WORK/merged.osm.pbf" "$WORK"/filtered/*.osm.pbf
          rm -rf "$WORK/filtered"
          osmium fileinfo -e -j "$WORK/merged.osm.pbf" > "$WORK/merged-fileinfo.json"

      - name: Convert OSM to raw layer FlatGeobuf
        run: |
          set -euo pipefail
          SPAT=$(deno run --lock=deno.lock --frozen --allow-read scripts/print-spat-bbox.js)
          echo "spat mask: $SPAT"
          echo "SPAT=$SPAT" >> "$GITHUB_ENV"
          # The output path has no .fgb suffix, which makes the driver write a
          # directory of one .fgb per layer. FlatGeobuf does not support random layer
          # writing, so GDAL re-reads the source once per layer: four passes, not
          # one. Budget accordingly. The 2> capture is not optional — an exhausted
          # CPL_TMPDIR makes the OSM driver emit a flood of "Cannot read node <id>"
          # and then return an empty result with a zero exit status.
          df -h "$WORK" | tail -1
          # The 2> capture also means a failing ogr2ogr prints nothing to the CI log,
          # because set -e kills the step before the cat below. Surface it explicitly.
          if ! OSM_CONFIG_FILE=$GITHUB_WORKSPACE/.github/build/osmconf.ini \
            ogr2ogr -f FlatGeobuf "$WORK/raw" "$WORK/merged.osm.pbf" \
              -spat $SPAT points lines multipolygons other_relations 2> "$WORK/ogr-main.log"; then
            echo "::error::ogr2ogr (main pass) failed — captured stderr below"
            cat "$WORK/ogr-main.log"
            exit 1
          fi
          df -h "$WORK" | tail -1
          # Second pass with closed_ways_are_polygons=building, so closed
          # natural=coastline ways (islands) are not routed into multipolygons. This
          # pass is the sole source of coastline features.
          if ! OSM_CONFIG_FILE=$GITHUB_WORKSPACE/.github/build/osmconf-lines.ini \
            ogr2ogr -f FlatGeobuf "$WORK/raw-lines" "$WORK/merged.osm.pbf" \
              -spat $SPAT lines 2> "$WORK/ogr-lines.log"; then
            echo "::error::ogr2ogr (coastline lines pass) failed — captured stderr below"
            cat "$WORK/ogr-lines.log"
            exit 1
          fi
          cat "$WORK/ogr-main.log" "$WORK/ogr-lines.log" > "$WORK/ogr.log" || true
          if grep -q "Cannot read node" "$WORK/ogr.log"; then
            echo "::error::GDAL node index exhausted (CPL_TMPDIR out of space) — the result is silently EMPTY with exit 0"
            exit 1
          fi
          # Relation geometry-assembly failures are warnings; count them into the
          # manifest so a rise is a build alarm.
          RELWARN=$(grep -c "Cannot assemble\|Invalid geometry\|Geometry of relation" "$WORK/ogr.log" || true)
          echo "REL_ASSEMBLY_WARNINGS=$RELWARN" >> "$GITHUB_ENV"
          echo "relation assembly warnings: $RELWARN"
          rm -f "$WORK/merged.osm.pbf"
          df -h "$WORK" | tail -1

      - name: Carve product layers
        run: |
          set -euo pipefail
          cd "$WORK/layers"
          # Only lakes-polygon is carved straight to a published layer here; every
          # other layer comes from clip-layers.js, which owns both the region filter
          # and the proximity clip.
          #
          # Three simplification rules, each of which GDAL enforces the hard way:
          #
          # - There is no -simplifyPreserveTopology flag. That name belongs to the
          #   GEOS function; ogr2ogr offers -simplify <tolerance> and -makevalid, and
          #   rejects the whole invocation with "ERROR 6: Unknown option name".
          # - No -makevalid. The source layer is uniformly MultiPolygon so the output
          #   layer is created MultiPolygon, and a geometry that comes back a plain
          #   Polygon or a GeometryCollection, which makevalid can return, cannot be
          #   written into it. Its motivation — Douglas-Peucker can self-intersect a
          #   megapolygon — is mild at ~11 m on lake shorelines, and the downstream
          #   consumers are point-in-polygon and nearest-edge distance, which tolerate
          #   it. -nlt PROMOTE_TO_MULTI instead makes the output type explicit so a
          #   collapsed Polygon is promoted rather than rejected.
          # - No -skipfailures: it would silently drop the offending feature, and
          #   losing one of the six lake relations is the catastrophic case, since
          #   every served beach classifies through the QID lake path. The count
          #   assertion below fails the build instead. It duplicates
          #   lakesIdentityRefusals() in build-manifest.js on purpose: that backstop
          #   is three steps later, and this is the step that can break the
          #   invariant.
          ogr2ogr -f FlatGeobuf lakes-polygon.fgb "$WORK/raw/multipolygons.fgb" -nln lakes_polygon \
            -simplify 0.0001 -nlt PROMOTE_TO_MULTI \
            -where "natural='water' AND water='lake' AND wikidata IN ('Q1066','Q1169','Q1383','Q5492','Q1062','Q736707')"
          LAKES=$(ogrinfo -al -so lakes-polygon.fgb 2>/dev/null | awk -F': ' '/Feature Count/ {print $2; exit}')
          echo "lakes-polygon features: ${LAKES:-0}"
          if [ "${LAKES:-0}" != "6" ]; then
            echo "::error::lakes-polygon.fgb has ${LAKES:-0} features, expected exactly 6 (the allowlisted Great Lake relations). Either OSM no longer tags one of them natural=water + water=lake + wikidata, or a geometry was dropped."
            ogrinfo -al -so lakes-polygon.fgb 2>&1 | head -30
            exit 1
          fi

      # Proximity clip: every remaining layer is reduced to features within
      # WATER_CLIP_PAD_DEG (0.01 deg, ~1.1 km) of a beach envelope. That is an order
      # of magnitude beyond the widest probe radius, so it cannot change a decision,
      # and it makes the layer set O(beaches) rather than O(continent).
      - name: Clip parks, coastline and water to the beach neighbourhood
        run: |
          set -euo pipefail
          deno run --lock=deno.lock --frozen --allow-read --allow-write scripts/clip-layers.js \
            --raw "$WORK/raw" --raw-lines "$WORK/raw-lines" \
            --out "$WORK/clipped"
          cd "$WORK/layers"
          for n in beaches-point beaches-line beaches-polygon other-relations \
                   parks-polygon parks-line coastline-line water-line water-polygon; do
            ogr2ogr -f FlatGeobuf "$n.fgb" "$WORK/clipped/$n.geojsonseq" -nln "$(echo $n | tr - _)"
          done
          rm -rf "$WORK/raw" "$WORK/raw-lines"
          # The clipped/*.count sidecars stay: build-manifest.js compares each
          # against ogrinfo's feature count and hard-refuses on a mismatch.
          ls -la "$WORK/layers"

      - name: Sanity floors, shrink-ratio refusal and manifest
        run: |
          set -euo pipefail
          # Emits manifest.json and SHA256SUMS, or exits 1 with a specific reason.
          # The absolute floors, per-region floors and shrink ratios live in the
          # script rather than this YAML, so they are unit-tested.
          #
          # --allow-run covers the ogrinfo feature-count and schema probe plus the
          # version stamps, and --allow-env the two runner-image vars the manifest
          # records. Both are scoped to exactly what the script touches, so adding a
          # third tool or env var fails here rather than widening this job's reach in
          # silence. Without --allow-env the script dies at manifest-assembly time
          # with a NotCapable throw, after every expensive step has run.
          deno run --lock=deno.lock --frozen \
            --allow-read --allow-write \
            --allow-run=ogrinfo,osmium \
            --allow-env=ImageOS,ImageVersion \
            scripts/build-manifest.js \
              --layers "$WORK/layers" \
              --floors data/layer-floors.json \
              --previous "$WORK/prev-manifest.json" \
              --snapshot "$OSM_SNAPSHOT" \
              --build-id "$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" \
              --git-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --allow-shrink "$ALLOW_SHRINK" \
              --counts "$WORK/clipped" \
              --sources "$WORK/sources.json" \
              --filters .github/build/expressions.txt \
              --relation-warnings "$REL_ASSEMBLY_WARNINGS" \
              --out "$WORK/layers/manifest.json"
          cp docs/ODbL-ATTRIBUTION.txt "$WORK/layers/LICENSE.txt"
          cat "$WORK/layers/manifest.json"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const sanity = m.sanity || {};
            const lines = [
              'BUILD_ID=' + m.buildId,
              'AUTO_PUBLISH=' + String(sanity.autoPublishAllowed === true),
              'SOURCES_VERIFIED=' + String(m.sourcesVerified === true)
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
            console.log(lines.join(' '));
          " "$WORK/layers/manifest.json"

      - name: Refuse to publish an unverified-source set
        # sourcesVerified false is not a build failure — the artifacts are honest and
        # worth keeping — but a set that cannot prove its downloads completed is one
        # src/layerManifest.js refuses to delete or classify from, so making it live
        # would silently park the whole pipeline. Fail here, where the reason is one
        # line.
        if: ${{ env.SOURCES_VERIFIED != 'true' }}
        run: |
          echo "::error::manifest sourcesVerified is false — the md5 download-completeness proof is missing, so this set could never delete or classify. Not publishing."
          exit 1

      - name: Upload the immutable prefix
        run: |
          set -euo pipefail
          PREFIX="layers/$BUILD_ID"
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
          cd "$WORK/layers"
          for f in *.fgb manifest.json SHA256SUMS LICENSE.txt; do
            case "$f" in
              *.fgb) ct=application/octet-stream ;;
              *.json) ct=application/json ;;
              *) ct=text/plain ;;
            esac
            aws s3 cp "$f" "s3://$R2_BUCKET/$PREFIX/$f" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "$ct" --only-show-errors
          done

      - name: Read back through the public domain and verify
        run: |
          set -euo pipefail
          cd "$WORK/verify"
          # SHA256SUMS covers the .fgb files and nothing else. It cannot cover
          # LICENSE.txt, copied in after build-manifest.js runs, and must not cover
          # manifest.json, which would fail this check every run for a file not
          # downloaded here. build-manifest.js pins that scope.
          cp "$WORK/layers/SHA256SUMS" .
          # --retry-all-errors so a few seconds of edge propagation on a
          # just-written key reads as a retry rather than a failed build; plain
          # --retry would not retry the 404 that lag produces.
          for f in $(cd "$WORK/layers" && ls *.fgb); do
            curl -sfL --retry 5 --retry-all-errors --retry-delay 5 "$R2_PUBLIC_BASE/$PREFIX/$f" -o "$f"
          done
          # A torn or mis-signed upload must never become the live set. ETag is
          # useless for this: a multipart object's ETag is not a content MD5.
          sha256sum -c SHA256SUMS
          # manifest.json is the sole input to the delete gate, so it is read back
          # and byte-compared rather than trusted.
          curl -sfL --retry 5 --retry-all-errors --retry-delay 5 "$R2_PUBLIC_BASE/$PREFIX/manifest.json" -o manifest.json
          cmp manifest.json "$WORK/layers/manifest.json"

      - name: Explain a withheld publish
        # Loud, and not a failure: the prefix is uploaded and complete, it is simply
        # not live. This is the bootstrap path — seed data/layer-floors.json from this
        # manifest, commit it, then re-dispatch with force_publish — and the
        # unseeded-regionsDigest path, where someone added a region to src/regions.js.
        if: ${{ env.PUBLISH == 'true' && env.AUTO_PUBLISH != 'true' && env.FORCE_PUBLISH != 'true' }}
        run: |
          echo "::warning::build-manifest.js withheld auto-publish (bootstrap build, or no seeded floors entry for this regionsDigest). The set is uploaded at $PREFIX but layers/current.json was NOT moved. Read the manifest above, seed data/layer-floors.json, commit it, then re-dispatch with force_publish true."

      - name: Publish the pointer
        # Two conjuncts, both required. PUBLISH is the operator's intent;
        # AUTO_PUBLISH is build-manifest.js's verdict on whether the evidence supports
        # going live. FORCE_PUBLISH is the human override for the bootstrap deadlock,
        # where the first build has no previous manifest and without a published
        # pointer the next build would not have one either; it is unavailable on a
        # scheduled run.
        if: ${{ env.PUBLISH == 'true' && (env.AUTO_PUBLISH == 'true' || env.FORCE_PUBLISH == 'true') }}
        run: |
          set -euo pipefail
          printf '{"buildId":"%s","prefix":"%s"}\n' "$BUILD_ID" "$PREFIX" > current.json
          # no-store, and JSON is not in Cloudflare's default-cached extension set,
          # so the pointer is never served stale. Every object it names is immutable,
          # so caching those is a win.
          aws s3 cp current.json "s3://$R2_BUCKET/layers/current.json" \
            --cache-control "no-store" --content-type application/json --only-show-errors
          echo "published $BUILD_ID"

      - name: Prune old layer sets
        # Same gate as Publish, deliberately: a run that did not move the pointer has
        # left an extra non-live prefix behind, and pruning there would delete sets to
        # make room for one nobody is reading. Withheld builds accumulate prefixes
        # until the next successful publish prunes them.
        if: ${{ env.PUBLISH == 'true' && (env.AUTO_PUBLISH == 'true' || env.FORCE_PUBLISH == 'true') }}
        run: |
          set -euo pipefail
          # Retain 8 sets, about a month of twice-weekly builds. buildId sorts
          # chronologically, so "newest 8" is a plain sort window, and the live prefix
          # is skipped unconditionally so pruning can never orphan the pointer. An
          # age-based R2 lifecycle rule is deliberately not used: if the build broke
          # for longer than the rule's age it would delete the live set.
          LIVE_PREFIX=$(curl -sfL "$R2_PUBLIC_BASE/layers/current.json?cb=$GITHUB_RUN_ID" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).prefix)})")
          echo "live prefix: $LIVE_PREFIX"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "layers/" --delimiter "/" \
            --query 'CommonPrefixes[].Prefix' --output text \
            | tr '\t' '\n' | sed '/^$/d' | sort | head -n -8 \
            | while read -r p; do
                # Skip the live prefix as named by current.json, not merely this
                # run's BUILD_ID. They coincide only because this step is
                # publish-gated; ungating it could orphan the pointer.
                case "$p" in *"$LIVE_PREFIX"*) continue ;; esac
                case "$p" in *"$BUILD_ID"*) continue ;; esac
                echo "pruning $p"
                aws s3 rm "s3://$R2_BUCKET/$p" --recursive --only-show-errors
              done
