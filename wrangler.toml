name = "swim-report"
main = "src/index.js"
compatibility_date = "2026-07-13"
routes = [
  { pattern = "swim.report", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

# Workers Cache: regional tiered response cache in front of the Worker
# (wrangler >= 4.69). Only responses carrying cacheable Cache-Control
# directives are stored — src/router.js sets an explicit policy per route
# (no-store on the geolocation-personalized home page; short max-age +
# stale-while-revalidate on detail pages and /api/*). Request path only;
# crons are unaffected.
[cache]
enabled = true

# Workers static assets: the committed brand files in public/ (favicon.svg,
# apple-touch-icon.png, icon-192/512.png, manifest.webmanifest, og/*.png),
# regenerated by scripts/build-brand-assets.js. Served by the platform before
# the Worker runs, so no request-path code reads them and the two-path rule is
# untouched. There is deliberately no binding: nothing in src/ may fetch an
# asset. not_found_handling stays at its default so every unmatched path still
# reaches the Worker, which owns "/" and every 404.
[assets]
directory = "public"

# 7 * * * *        — hourly flag recompute (estimates + official scrapes -> the
#                    beach_state D1 table, one row per beach, batched 200 at a time).
#                    Offset off the congested top-of-hour :00 slot the repo's own
#                    GH workflows deliberately avoid. It READS (never fetches) the
#                    beach_state.wave record that .github/workflows/waves.yml writes
#                    out of band from NOAA GRIB2 model output, off the join its own
#                    SELECT already issues, resolving each record through
#                    src/waveInput.js, which indexes the stored 24 h series at the
#                    hour being estimated. Those records carry an ABSOLUTE wave_expires
#                    derived from the model valid time rather than from write time,
#                    so no schedule ordering between this cron and that workflow is
#                    required or implied: a late or missing pipeline run ages a beach
#                    out to unknown instead of serving stale data.
# 3-53/10 * * * * — recompute-and-diff alerts refresh, every 10 minutes. Three national
#                    fetches, no per-beach upstream call, and a compare-and-set on
#                    beach_state.estimate only for beaches whose recomputed payload
#                    differs from the one they are standing on. Offset off :07 so it
#                    never fires inside the hourly recompute's measured wall-clock
#                    window, and off every other minute already in this list.
# 15 */6 * * *     — 6-hourly water-temperature refresh. Sole writer of watertemp:,
#                    and sole writer and reader of the wave_updated rotation cursor.
#
# NO CRON THAT FANS OUT AN UPSTREAM CALL PER BEACH MAY GO SUB-HOURLY. What a
# sub-hour interval actually costs is CPU: Cloudflare gives such an invocation
# 30 seconds instead of 15 minutes, while wall clock stays 15 minutes either way.
# The full 3000-beach hourly run measures 1.0-2.7 s of CPU, so CPU is not what
# keeps it hourly — its WALL clock is, and wall clock is what a beach-walking
# fan-out consumes. The alerts refresh above makes three national fetches and
# writes only the beaches whose recomputed payload moved, so it fits.
# Changing a cron string is a FIVE-file edit (this file, package.json's seed:*
# URLs, CRON_JOBS in src/index.js, the cron strings hard-coded in the tests, and
# whichever docs quote the schedule). test/cronTriggers.test.js catches a
# wrangler.toml / CRON_JOBS mismatch, which nothing did before; the rest still
# fail silently.
# 17 3,9,15,21 * * * — NWS point enrichment, 4x daily
# 29 4,10,16,22 * * * — ECCC zone enrichment, 4x daily (Canadian beaches the
#                    NWS enrichment permanently parked)
# 31 9 * * *       — daily Windy webcam hydration
#
# beaches.marine_zone is now derived OFFLINE by the GitHub Actions discovery
# batch (a nearest-marine-zone point-in-polygon pass over the repo-committed NWS
# marine-zone shapefile geometry in data/marine-zones.json), replacing
# the retired in-Worker marine enrichment cron. Beach discovery (prebuilt OSM
# layers, fetched from R2 by the GitHub Actions job — never by this Worker) and
# water-body classification also run only in that offline batch
# (scripts/discovery-batch.js), which emits an idempotent SQL delta bulk-loaded
# into D1 out-of-band. The NOAA wave cycle keeps only its per-cycle manifest and
# the waves/current.json pointer in the same bucket, likewise read only by GitHub
# Actions, which applies the per-beach wave records into beach_state as an
# idempotent SQL delta exactly as the discovery batch does.
#
# The request path still reads only D1/KV, and the cron path only the upstreams
# named above — which is why there is deliberately no [[r2_buckets]] binding
# anywhere in this file. Adding one would put an offline artifact store within
# reach of the request path and break the two-path rule at the config layer.
[triggers]
crons = ["7 * * * *", "3-53/10 * * * *", "15 */6 * * *", "17 3,9,15,21 * * *", "29 4,10,16,22 * * *", "31 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "swim-report"
database_id = "694e08f2-01dd-4ece-9bd3-61da4c6f8481"

[[kv_namespaces]]
binding = "FLAGS"
id = "d7814f3408de401e8fef467754c18381"
